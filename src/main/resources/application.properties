#Spring config properties
spring.config.import=optional:file:.env[.properties]

spring.application.name=wikify

# Configuração de Conexão com o PostgreSQL
spring.datasource.url=${DB_CONN}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# O schema é criado pelas migrations do Flyway (src/main/resources/db/migration).
# 'validate' faz o Hibernate apenas CONFERIR se as entidades batem com o banco —
# ele nunca mais altera nada por conta própria.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.schemas=public
spring.flyway.default-schema=public

api.security.token.secret=${SECRET_KEY}

# Cookie do refresh token
# secure=false so em desenvolvimento (HTTP local); em producao tem que ser true
api.security.cookie.secure=${COOKIE_SECURE:false}

# Se a API for para outro dominio registravel, muda para None — e ai secure=true e obrigatorio.
api.security.cookie.same-site=${COOKIE_SAME_SITE:Strict}

# Origens liberadas no CORS (lista separada por virgula)
api.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Limite de Upload
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

