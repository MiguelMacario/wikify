#Spring config properties
spring.config.import=optional:file:.env[.properties]

spring.application.name=wikify

# Configuração de Conexão com o PostgreSQL
spring.datasource.url=${DB_CONN}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

api.security.token.secret=${SECRET_KEY}

# Cookie do refresh token
# secure=false so em desenvolvimento (HTTP local); em producao tem que ser true
api.security.cookie.secure=${COOKIE_SECURE:false}

# Se a API for para outro dominio registravel, muda para None — e ai secure=true e obrigatorio.
api.security.cookie.same-site=${COOKIE_SAME_SITE:Strict}

# Origens liberadas no CORS (lista separada por virgula)
api.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

